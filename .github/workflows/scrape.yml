name: Daily Player Stats Update

on:
  schedule:
    # Runs at 5 AM EST daily (10 AM UTC)
    - cron: '0 10 * * *'

  # Allows manual triggering from the Actions tab
  workflow_dispatch:
    inputs:
      team_limit:
        description: 'Only scrape the first N teams (leave blank for all of D1)'
        required: false
        default: ''

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Scrape D1 rosters/stats and upsert to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TEAM_LIMIT: ${{ github.event.inputs.team_limit }}
        run: python scraper/scrape_espn.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "Daily stats update failed! Check the logs above for errors."
