<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>College Basketball Scouting Database</h1>
    <nav>
      <a href="index.html">Players</a>
      <a href="report.html">Submit a Report</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main>
    <div id="content">
      <p class="status-line">Loading...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    function renderCareerTable(career) {
      if (career.length === 0) {
        return '<p class="player-meta">No career history on file for this player.</p>';
      }
      const rows = career
        .map(
          (s) => `
        <tr>
          <td>${escapeHtml(s.season_display)}</td>
          <td>${escapeHtml(s.school)}</td>
          <td>${fmtStat(s.gp, 0)}</td>
          <td>${fmtStat(s.min)}</td>
          <td>${fmtStat(s.ppg)}</td>
          <td>${fmtStat(s.rpg)}</td>
          <td>${fmtStat(s.apg)}</td>
          <td>${fmtStat(s.spg)}</td>
          <td>${fmtStat(s.bpg)}</td>
          <td>${fmtPct(s.fg_pct)}</td>
          <td>${fmtPct(s.three_pct)}</td>
          <td>${fmtPct(s.ft_pct)}</td>
        </tr>`
        )
        .join("");
      return `
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Season</th>
                <th>School</th>
                <th>GP</th>
                <th>MIN</th>
                <th>PPG</th>
                <th>RPG</th>
                <th>APG</th>
                <th>SPG</th>
                <th>BPG</th>
                <th>FG%</th>
                <th>3P%</th>
                <th>FT%</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    let currentPlayer = null;
    let hmSplit; // undefined = not loaded yet, null = no games vs High/Mid Majors
    let hmOnly = qs("hm") === "1";

    function renderStats() {
      const p = hmOnly ? withSplitStats(currentPlayer, hmSplit) : currentPlayer;
      const isJuco = playerLevel(currentPlayer) === "JUCO";
      const jucoNote = !isJuco
        ? ""
        : currentPlayer.gp === null || currentPlayer.gp === undefined
        ? '<p class="player-meta">No 2025-26 NJCAA stats on file (incoming player).</p>'
        : `<p class="player-meta">2025-26 NJCAA stats${currentPlayer.stats_school ? ` at ${escapeHtml(currentPlayer.stats_school)}` : ""}.</p>`;
      // D1 rosters are 2026-27 but stats stay 2025-26 - say so when they're from another school
      // (a transfer) or there are none (freshman, or new to D1).
      const d1Note =
        playerLevel(currentPlayer) !== "D1"
        ? ""
        : currentPlayer.gp === null || currentPlayer.gp === undefined
        ? '<p class="player-meta">No 2025-26 D1 stats on file (freshman or new to D1).</p>'
        : currentPlayer.stats_school
        ? `<p class="player-meta">2025-26 stats at ${escapeHtml(currentPlayer.stats_school)}.</p>`
        : "";
      const note =
        isJuco
        ? jucoNote
        : hmOnly && !hmSplit
          ? '<p class="player-meta">No games vs High/Mid Major opponents on record.</p>'
          : hmOnly
          ? '<p class="player-meta">Games vs ACC, Big Ten, Big East, Big 12, SEC, Pac-12, Mountain West, A-10, American and MVC opponents only (2025-26).</p>'
          : d1Note;
      document.getElementById("stats-section").innerHTML = `
          ${note}
          <div class="stat-grid">
            <div class="stat-tile"><div class="value">${fmtStat(p.gp, 0)}</div><div class="label">GP</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.min)}</div><div class="sub">${fmtCount(p.tot_min)} total</div><div class="label">MIN</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.ppg)}</div><div class="sub">${fmtCount(p.tot_pts)} total</div><div class="label">PPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.rpg)}</div><div class="sub">${fmtCount(p.tot_reb)} total</div><div class="label">RPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.apg)}</div><div class="sub">${fmtCount(p.tot_ast)} total</div><div class="label">APG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.spg)}</div><div class="sub">${fmtCount(p.tot_stl)} total</div><div class="label">SPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.bpg)}</div><div class="sub">${fmtCount(p.tot_blk)} total</div><div class="label">BPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.topg)}</div><div class="sub">${fmtCount(p.tot_tov)} total</div><div class="label">TOPG</div></div>
            <div class="stat-tile"><div class="value">${fmtPct(p.fg_pct)}</div><div class="sub">${fmtMadeAtt(p.fgm, p.fga)}</div><div class="label">FG%</div></div>
            <div class="stat-tile"><div class="value">${fmtPct(p.three_pct)}</div><div class="sub">${fmtMadeAtt(p.fg3m, p.fg3a)}</div><div class="label">3P%</div></div>
            <div class="stat-tile"><div class="value">${fmtPct(p.ft_pct)}</div><div class="sub">${fmtMadeAtt(p.ftm, p.fta)}</div><div class="label">FT%</div></div>
          </div>
          <h3 style="margin:18px 0 0;">Advanced <span class="player-meta">(2025-26)</span></h3>
          <div class="stat-grid">
            <div class="stat-tile d1-only" title="% of available offensive rebounds grabbed while on the floor"><div class="value">${fmtPct(p.orb_pct)}</div><div class="label">ORB%</div></div>
            <div class="stat-tile d1-only" title="% of available defensive rebounds grabbed while on the floor"><div class="value">${fmtPct(p.drb_pct)}</div><div class="label">DRB%</div></div>
            <div class="stat-tile d1-only" title="% of opponent possessions ending in a steal by the player while on the floor"><div class="value">${fmtPct(p.stl_pct)}</div><div class="label">STL%</div></div>
            <div class="stat-tile d1-only" title="% of opponent 2-point attempts blocked by the player while on the floor"><div class="value">${fmtPct(p.blk_pct)}</div><div class="label">BLK%</div></div>
            <div class="stat-tile" title="Free throw attempts per field goal attempt (FTA ÷ FGA)"><div class="value">${fmtStat(p.ft_rate, 3)}</div><div class="label">FT Rate</div></div>
          </div>`;
      document.getElementById("hm-toggle").setAttribute("aria-pressed", String(hmOnly));
    }

    async function toggleHm(e) {
      const btn = e.currentTarget;
      if (hmSplit === undefined) {
        btn.disabled = true;
        try {
          hmSplit = await fetchSplit(currentPlayer.player_id, "vs_hm");
        } catch (err) {
          console.error(err);
          return;
        } finally {
          btn.disabled = false;
        }
      }
      hmOnly = !hmOnly;
      renderStats();
    }

    function renderPlayer(p, reports, loggedIn, career) {
      currentPlayer = p;
      const content = document.getElementById("content");
      const reportsSection = loggedIn
        ? `
        <div class="card">
          <h2 style="margin-top:0;">Scouting Reports (${reports.length})</h2>
          <div id="reports-list">
            ${
              reports.length === 0
                ? '<p class="player-meta">No reports yet for this player.</p>'
                : reports.map(renderReportCard).join("")
            }
          </div>
        </div>`
        : `
        <div class="card">
          <h2 style="margin-top:0;">Scouting Reports</h2>
          <p class="player-meta">Scouting reports are only visible to signed-in accounts.
            <a href="login.html?return=${encodeURIComponent("player.html?id=" + p.player_id)}">Log in</a> to view them.</p>
        </div>`;

      const lvl = playerLevel(p);
      const isJuco = lvl === "JUCO";
      const isAdded = lvl === "ADDED";
      document.body.classList.toggle("juco-mode", isJuco);
      document.body.classList.toggle("added-mode", isAdded);
      const schoolLine = isJuco
        ? [p.school, `NJCAA ${p.juco_division || ""}`.trim(), p.conference].filter(Boolean).map(escapeHtml).join(" &middot; ")
        : isAdded
        ? [p.school, p.added_level].filter(Boolean).map(escapeHtml).join(" &middot; ")
        : `${escapeHtml(p.school || "")} &middot; ${escapeHtml(p.conference || "")} &middot; 2025-26 Record: ${escapeHtml(p.record || "—")}`;
      const addedNote = isAdded
        ? `<p class="player-meta" style="margin-top:10px;">Added by ${escapeHtml(p.added_by || "a scout")} &middot; not on an ESPN or NJCAA roster, so no stats on file.</p>`
        : "";
      const origin = [p.hometown, p.high_school].filter(Boolean).map(escapeHtml).join(" &middot; ");

      content.innerHTML = `
        <div class="card">
          <div class="player-heading">
            <h1>${escapeHtml(p.name)}</h1>
            <span class="player-meta">${[p.position, p.class, p.height, p.weight].filter(Boolean).map(escapeHtml).join(" &middot; ")}</span>
          </div>
          <div class="player-meta" style="margin-top:6px;">${schoolLine}</div>
          ${origin ? `<div class="player-meta" style="margin-top:2px;">${origin}</div>` : ""}
          ${addedNote}
          <div id="flag-bar" class="flag-bar"></div>
          <div class="d1-only" style="margin-top:14px;">
            <button class="btn secondary" id="hm-toggle" type="button" aria-pressed="false">vs High/Mid Major Only</button>
          </div>
          <div id="stats-section" class="stats-only"></div>
          <p class="player-meta stats-only" style="margin-top:14px;">Stats last updated: ${p.last_updated ? new Date(p.last_updated).toLocaleString() : "—"}</p>
          <a class="btn" href="report.html?id=${encodeURIComponent(p.player_id)}">Add a Scouting Report</a>
        </div>

        <div class="card d1-only">
          <h2 style="margin-top:0;">Career History</h2>
          ${renderCareerTable(career)}
        </div>

        ${reportsSection}
      `;
      document.getElementById("hm-toggle").addEventListener("click", toggleHm);
      renderStats();
      renderFlagBar();
    }

    // ---------- Flags ----------
    let flagTypes = null; // null = couldn't load (offline with no saved copy) - bar stays hidden
    let playerFlagId = null;
    let flagForm = null; // { id?, label, color } while adding/editing a color
    let editingFlags = false;
    // The colors a flag can be - tap-friendly swatches instead of a color wheel, picked to stay
    // distinct from each other on the dark background.
    const FLAG_COLORS = [
      ["#e53935", "Red"], ["#fb8c00", "Orange"], ["#fdd835", "Yellow"], ["#7cb342", "Light green"],
      ["#1b8a3a", "Dark green"], ["#00897b", "Teal"], ["#26c6da", "Cyan"], ["#1e88e5", "Blue"],
      ["#3f51b5", "Indigo"], ["#9c27b0", "Purple"], ["#f06292", "Pink"], ["#8d6e63", "Brown"],
      ["#9e9e9e", "Gray"], ["#ffffff", "White"],
    ];

    function swatchesHtml(selected) {
      const used = Object.fromEntries(flagTypes.filter((f) => f.id !== flagForm.id).map((f) => [f.color.toLowerCase(), f.label]));
      const colors = [...FLAG_COLORS];
      // A flag saved with a color that's no longer in the list keeps it as an option.
      if (!colors.some(([c]) => c === selected.toLowerCase())) colors.push([selected, "Current color"]);
      return colors
        .map(([c, name]) => {
          const usedBy = used[c.toLowerCase()];
          const label = usedBy ? `${name} (used for ${usedBy})` : name;
          return `<button type="button" class="swatch${usedBy ? " used" : ""}" role="radio" data-color="${c}"
            aria-checked="${c.toLowerCase() === selected.toLowerCase()}" aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}"
            style="--swatch:${c}"></button>`;
        })
        .join("");
    }

    // Closed (normal): just this player's flag, or a "Flag player" button if he has none - so
    // removing it really makes it go away. Open: every color, to pick one, add or edit colors.
    let pickerOpen = false;

    function renderFlagBar() {
      const bar = document.getElementById("flag-bar");
      if (!bar || !flagTypes) return;
      const current = flagTypes.find((f) => f.id === playerFlagId);
      if (!pickerOpen && !editingFlags && !flagForm) {
        bar.innerHTML = current
          ? `<span class="field-label">Flag</span>
             <span class="flag-chip current" style="--flag:${escapeHtml(current.color)}">${flagDot(current)}${escapeHtml(current.label)}</span>
             <button type="button" class="flag-chip" id="flag-open">Change</button>
             <button type="button" class="flag-chip clear" id="flag-clear" title="Unflag this player only - the color stays">&#10005; Remove flag</button>
             <div id="flag-msg"></div>`
          : `<span class="field-label">Flag</span>
             <button type="button" class="flag-chip add" id="flag-open">+ Flag player</button>
             <div id="flag-msg"></div>`;
        document.getElementById("flag-open").addEventListener("click", () => {
          pickerOpen = true;
          renderFlagBar();
        });
        const clear = document.getElementById("flag-clear");
        if (clear) clear.addEventListener("click", () => chooseFlag(null));
        return;
      }

      const chips = flagTypes
        .map(
          (f) => `<button type="button" class="flag-chip" data-flag-id="${escapeHtml(f.id)}"
            aria-pressed="${f.id === playerFlagId}" style="--flag:${escapeHtml(f.color)}">${flagDot(f)}${escapeHtml(f.label)}${editingFlags ? " &#9998;" : ""}</button>`
        )
        .join("");
      const form = !flagForm
        ? ""
        : `<div class="flag-form">
            <div class="swatches" role="radiogroup" aria-label="Color">${swatchesHtml(flagForm.color)}</div>
            <input type="text" id="flag-label" value="${escapeHtml(flagForm.label)}" placeholder="What does it mean? e.g. Target" maxlength="40" />
            <button type="button" class="btn" id="flag-save">${flagForm.id ? "Save" : "Add"}</button>
            <button type="button" class="btn secondary" id="flag-cancel">Cancel</button>
            ${flagForm.id ? '<button type="button" class="btn secondary danger" id="flag-delete">Delete this color for all players</button>' : ""}
          </div>`;
      bar.innerHTML = `
        <span class="field-label">Flag</span>
        ${chips}
        ${editingFlags ? "" : '<button type="button" class="flag-chip add" id="flag-add">+ Add color</button>'}
        ${flagTypes.length || flagForm ? "" : '<span class="flag-hint">Make a color to flag players with (e.g. Target, Watch) and filter by it on the Players page.</span>'}
        ${flagTypes.length ? `<a href="#" id="flag-edit-toggle">${editingFlags ? "Done editing" : "Edit colors"}</a>` : ""}
        <a href="#" id="flag-close">Close</a>
        ${form}
        <div id="flag-msg"></div>`;

      bar.querySelectorAll("button[data-flag-id]").forEach((b) =>
        b.addEventListener("click", () => {
          const f = flagTypes.find((x) => x.id === b.dataset.flagId);
          if (editingFlags) {
            flagForm = { ...f };
            renderFlagBar();
          } else {
            pickerOpen = false; // picked - back to just showing his flag
            chooseFlag(f.id);
          }
        })
      );
      document.getElementById("flag-close").addEventListener("click", (e) => {
        e.preventDefault();
        pickerOpen = editingFlags = false;
        flagForm = null;
        renderFlagBar();
      });
      const add = document.getElementById("flag-add");
      if (add)
        add.addEventListener("click", () => {
          // Start on the first color nobody's using yet.
          const used = new Set(flagTypes.map((f) => f.color.toLowerCase()));
          flagForm = { label: "", color: (FLAG_COLORS.find(([c]) => !used.has(c)) || FLAG_COLORS[0])[0] };
          renderFlagBar();
          document.getElementById("flag-label").focus();
        });
      const toggle = document.getElementById("flag-edit-toggle");
      if (toggle)
        toggle.addEventListener("click", (e) => {
          e.preventDefault();
          editingFlags = !editingFlags;
          flagForm = null;
          renderFlagBar();
        });
      if (flagForm) {
        // Picking a color just moves the check, so whatever's typed in the name box stays.
        bar.querySelectorAll(".swatch").forEach((s) =>
          s.addEventListener("click", () => {
            flagForm.color = s.dataset.color;
            bar.querySelectorAll(".swatch").forEach((x) => x.setAttribute("aria-checked", String(x === s)));
          })
        );
        document.getElementById("flag-save").addEventListener("click", saveFlagForm);
        document.getElementById("flag-label").addEventListener("keydown", (e) => {
          if (e.key === "Enter") saveFlagForm();
        });
        document.getElementById("flag-cancel").addEventListener("click", () => {
          flagForm = null;
          renderFlagBar();
        });
        const del = document.getElementById("flag-delete");
        if (del) del.addEventListener("click", deleteFlagForm);
      }
    }

    function flagError(err) {
      console.error(err);
      document.getElementById("flag-msg").innerHTML = `<div class="msg error">${
        isNetworkError(err) ? "No connection - flags can only be changed online." : "Couldn't save: " + escapeHtml(err.message)
      }</div>`;
    }

    async function chooseFlag(flagId) {
      const before = playerFlagId;
      playerFlagId = flagId; // show it right away, undo if the save fails
      renderFlagBar();
      noteFlagEdit(currentPlayer.player_id, flagId); // so the Players list shows it immediately
      try {
        await setPlayerFlag(currentPlayer.player_id, flagId);
      } catch (err) {
        noteFlagEdit(currentPlayer.player_id, before);
        playerFlagId = before;
        renderFlagBar();
        flagError(err);
      }
    }

    async function saveFlagForm() {
      const label = document.getElementById("flag-label").value.trim();
      const color = flagForm.color;
      if (!label) {
        document.getElementById("flag-msg").innerHTML = '<div class="msg error">Give the color a name so it\'s clear what it means.</div>';
        return;
      }
      try {
        const saved = await saveFlagType({ id: flagForm.id, label, color });
        const isNew = !flagForm.id;
        flagTypes = isNew ? [...flagTypes, saved] : flagTypes.map((f) => (f.id === saved.id ? saved : f));
        flagForm = null;
        if (isNew) {
          pickerOpen = false;
          chooseFlag(saved.id); // adding a color from a player's page flags him with it
        } else {
          renderFlagBar();
        }
      } catch (err) {
        flagError(err);
      }
    }

    async function deleteFlagForm() {
      if (
        !confirm(
          `Delete the color "${flagForm.label}" for ALL players? Everyone flagged with it loses the flag.\n\n` +
            `To unflag just this player, cancel and use "Remove flag" instead.`
        )
      )
        return;
      try {
        await deleteFlagType(flagForm.id);
        flagTypes = flagTypes.filter((f) => f.id !== flagForm.id);
        if (playerFlagId === flagForm.id) playerFlagId = null;
        flagForm = null;
        if (!flagTypes.length) editingFlags = false;
        renderFlagBar();
      } catch (err) {
        flagError(err);
      }
    }

    function renderReportCard(r) {
      const field = (label, value) =>
        value
          ? `<div class="report-field"><div class="field-label">${label}</div><div>${escapeHtml(value)}</div></div>`
          : "";
      return `
        <div class="report-card">
          <div class="report-head">
            <span><strong>${escapeHtml(r.scout_name)}</strong> &middot; ${escapeHtml(r.date_watched)}${r.context ? " &middot; " + escapeHtml(r.context) : ""}</span>
            <span>
              ${r.overall_grade !== null && r.overall_grade !== undefined ? `<span class="grade-pill">${escapeHtml(r.overall_grade)}/10</span>` : ""}
              <a class="btn secondary edit-btn" href="report.html?edit=${encodeURIComponent(r.id)}">Edit</a>
            </span>
          </div>
          ${r.updated_at ? `<div class="player-meta">Edited ${escapeHtml(new Date(r.updated_at).toLocaleString())}</div>` : ""}
          ${field("Parents", r.parents)}
          ${field("AAU Coach", r.aau_coach)}
          ${field("Agent", r.agent)}
          ${field("Finances", r.finances)}
          ${field("Why he would be successful", r.success_reasons)}
          ${field("Why he wouldn't be successful", r.failure_reasons)}
          ${field("Notes from live game play", r.live_game_notes)}
          ${field("Projection", r.projection)}
          ${field("Strengths", r.strengths)}
          ${field("Weaknesses", r.weaknesses)}
          ${field("Confidence", r.confidence_level ? `${r.confidence_level}/5` : "")}
          ${field("Recommend for follow-up", r.would_recommend)}
          ${field("Notes", r.notes)}
        </div>
      `;
    }

    (async function init() {
      renderAuthNav();
      const id = qs("id");
      const content = document.getElementById("content");
      if (!id) {
        content.innerHTML = '<p class="status-line">No player specified.</p>';
        return;
      }
      try {
        const session = await getSession();
        const canViewReports = !!session || !window.REQUIRE_LOGIN_FOR_REPORTS;
        // Flags are extra - if they can't load (offline with no saved copy) the page still works.
        const noFlags = (err) => (console.error(err), null);
        let player, reports, career;
        [player, reports, career, flagTypes, playerFlagId] = await Promise.all([
          fetchPlayer(id),
          canViewReports ? fetchReports(id) : Promise.resolve([]),
          fetchCareerStats(id),
          fetchFlagTypes().catch(noFlags),
          fetchPlayerFlag(id).catch(noFlags),
        ]);
        if (!player) {
          content.innerHTML = '<p class="status-line">Player not found.</p>';
          return;
        }
        if (hmOnly) hmSplit = await fetchSplit(player.player_id, "vs_hm");
        renderPlayer(player, reports, canViewReports, career);
      } catch (e) {
        content.innerHTML = `<p class="status-line">Failed to load player: ${escapeHtml(e.message)}</p>`;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
