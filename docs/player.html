<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>College Basketball Scouting Database</h1>
    <nav>
      <a href="index.html">Players</a>
      <a href="report.html">Submit a Report</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main>
    <div id="content">
      <p class="status-line">Loading...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    function renderCareerTable(career) {
      if (career.length === 0) {
        return '<p class="player-meta">No career history on file for this player.</p>';
      }
      const rows = career
        .map(
          (s) => `
        <tr>
          <td>${escapeHtml(s.season_display)}</td>
          <td>${escapeHtml(s.school)}</td>
          <td>${fmtStat(s.gp, 0)}</td>
          <td>${fmtStat(s.min)}</td>
          <td>${fmtStat(s.ppg)}</td>
          <td>${fmtStat(s.rpg)}</td>
          <td>${fmtStat(s.apg)}</td>
          <td>${fmtStat(s.spg)}</td>
          <td>${fmtStat(s.bpg)}</td>
          <td>${fmtPct(s.fg_pct)}</td>
          <td>${fmtPct(s.three_pct)}</td>
          <td>${fmtPct(s.ft_pct)}</td>
        </tr>`
        )
        .join("");
      return `
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Season</th>
                <th>School</th>
                <th>GP</th>
                <th>MIN</th>
                <th>PPG</th>
                <th>RPG</th>
                <th>APG</th>
                <th>SPG</th>
                <th>BPG</th>
                <th>FG%</th>
                <th>3P%</th>
                <th>FT%</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    }

    let currentPlayer = null;
    let hmSplit; // undefined = not loaded yet, null = no games vs High/Mid Majors
    let hmOnly = qs("hm") === "1";

    function renderStats() {
      const p = hmOnly ? withSplitStats(currentPlayer, hmSplit) : currentPlayer;
      const note =
        hmOnly && !hmSplit
          ? '<p class="player-meta">No games vs High/Mid Major opponents on record.</p>'
          : hmOnly
          ? '<p class="player-meta">Games vs ACC, Big Ten, Big East, Big 12, SEC, Pac-12, Mountain West, A-10, American and MVC opponents only (2025-26).</p>'
          : "";
      document.getElementById("stats-section").innerHTML = `
          ${note}
          <div class="stat-grid">
            <div class="stat-tile"><div class="value">${fmtStat(p.gp, 0)}</div><div class="label">GP</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.min)}</div><div class="sub">${fmtCount(p.tot_min)} total</div><div class="label">MIN</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.ppg)}</div><div class="sub">${fmtCount(p.tot_pts)} total</div><div class="label">PPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.rpg)}</div><div class="sub">${fmtCount(p.tot_reb)} total</div><div class="label">RPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.apg)}</div><div class="sub">${fmtCount(p.tot_ast)} total</div><div class="label">APG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.spg)}</div><div class="sub">${fmtCount(p.tot_stl)} total</div><div class="label">SPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.bpg)}</div><div class="sub">${fmtCount(p.tot_blk)} total</div><div class="label">BPG</div></div>
            <div class="stat-tile"><div class="value">${fmtStat(p.topg)}</div><div class="sub">${fmtCount(p.tot_tov)} total</div><div class="label">TOPG</div></div>
            <div class="stat-tile"><div class="value">${fmtPct(p.fg_pct)}</div><div class="sub">${fmtMadeAtt(p.fgm, p.fga)}</div><div class="label">FG%</div></div>
            <div class="stat-tile"><div class="value">${fmtPct(p.three_pct)}</div><div class="sub">${fmtMadeAtt(p.fg3m, p.fg3a)}</div><div class="label">3P%</div></div>
            <div class="stat-tile"><div class="value">${fmtPct(p.ft_pct)}</div><div class="sub">${fmtMadeAtt(p.ftm, p.fta)}</div><div class="label">FT%</div></div>
          </div>
          <h3 style="margin:18px 0 0;">Advanced <span class="player-meta">(2025-26)</span></h3>
          <div class="stat-grid">
            <div class="stat-tile" title="% of available offensive rebounds grabbed while on the floor"><div class="value">${fmtPct(p.orb_pct)}</div><div class="label">ORB%</div></div>
            <div class="stat-tile" title="% of available defensive rebounds grabbed while on the floor"><div class="value">${fmtPct(p.drb_pct)}</div><div class="label">DRB%</div></div>
            <div class="stat-tile" title="% of opponent possessions ending in a steal by the player while on the floor"><div class="value">${fmtPct(p.stl_pct)}</div><div class="label">STL%</div></div>
            <div class="stat-tile" title="% of opponent 2-point attempts blocked by the player while on the floor"><div class="value">${fmtPct(p.blk_pct)}</div><div class="label">BLK%</div></div>
            <div class="stat-tile" title="Free throw attempts per field goal attempt (FTA ÷ FGA)"><div class="value">${fmtStat(p.ft_rate, 3)}</div><div class="label">FT Rate</div></div>
          </div>`;
      document.getElementById("hm-toggle").setAttribute("aria-pressed", String(hmOnly));
    }

    async function toggleHm(e) {
      const btn = e.currentTarget;
      if (hmSplit === undefined) {
        btn.disabled = true;
        try {
          hmSplit = await fetchSplit(currentPlayer.player_id, "vs_hm");
        } catch (err) {
          console.error(err);
          return;
        } finally {
          btn.disabled = false;
        }
      }
      hmOnly = !hmOnly;
      renderStats();
    }

    function renderPlayer(p, reports, loggedIn, career) {
      currentPlayer = p;
      const content = document.getElementById("content");
      const reportsSection = loggedIn
        ? `
        <div class="card">
          <h2 style="margin-top:0;">Scouting Reports (${reports.length})</h2>
          <div id="reports-list">
            ${
              reports.length === 0
                ? '<p class="player-meta">No reports yet for this player.</p>'
                : reports.map(renderReportCard).join("")
            }
          </div>
        </div>`
        : `
        <div class="card">
          <h2 style="margin-top:0;">Scouting Reports</h2>
          <p class="player-meta">Scouting reports are only visible to signed-in accounts.
            <a href="login.html?return=${encodeURIComponent("player.html?id=" + p.player_id)}">Log in</a> to view them.</p>
        </div>`;

      content.innerHTML = `
        <div class="card">
          <div class="player-heading">
            <h1>${escapeHtml(p.name)}</h1>
            <span class="player-meta">${escapeHtml(p.position || "")} &middot; ${escapeHtml(p.class || "")} &middot; ${escapeHtml(p.height || "")} &middot; ${escapeHtml(p.weight || "")}</span>
          </div>
          <div class="player-meta" style="margin-top:6px;">
            ${escapeHtml(p.school || "")} &middot; ${escapeHtml(p.conference || "")} &middot; Record: ${escapeHtml(p.record || "—")}
          </div>
          <div style="margin-top:14px;">
            <button class="btn secondary" id="hm-toggle" type="button" aria-pressed="false">vs High/Mid Major Only</button>
          </div>
          <div id="stats-section"></div>
          <p class="player-meta" style="margin-top:14px;">Stats last updated: ${p.last_updated ? new Date(p.last_updated).toLocaleString() : "—"}</p>
          <a class="btn" href="report.html?id=${encodeURIComponent(p.player_id)}">Add a Scouting Report</a>
        </div>

        <div class="card">
          <h2 style="margin-top:0;">Career History</h2>
          ${renderCareerTable(career)}
        </div>

        ${reportsSection}
      `;
      document.getElementById("hm-toggle").addEventListener("click", toggleHm);
      renderStats();
    }

    function renderReportCard(r) {
      const field = (label, value) =>
        value
          ? `<div class="report-field"><div class="field-label">${label}</div><div>${escapeHtml(value)}</div></div>`
          : "";
      return `
        <div class="report-card">
          <div class="report-head">
            <span><strong>${escapeHtml(r.scout_name)}</strong> &middot; ${escapeHtml(r.date_watched)}${r.context ? " &middot; " + escapeHtml(r.context) : ""}</span>
            ${r.overall_grade !== null && r.overall_grade !== undefined ? `<span class="grade-pill">${escapeHtml(r.overall_grade)}/10</span>` : ""}
          </div>
          ${field("Parents", r.parents)}
          ${field("AAU Coach", r.aau_coach)}
          ${field("Agent", r.agent)}
          ${field("Finances", r.finances)}
          ${field("Why he would be successful", r.success_reasons)}
          ${field("Why he wouldn't be successful", r.failure_reasons)}
          ${field("Notes from live game play", r.live_game_notes)}
          ${field("Projection", r.projection)}
          ${field("Strengths", r.strengths)}
          ${field("Weaknesses", r.weaknesses)}
          ${field("Confidence", r.confidence_level ? `${r.confidence_level}/5` : "")}
          ${field("Recommend for follow-up", r.would_recommend)}
          ${field("Notes", r.notes)}
        </div>
      `;
    }

    (async function init() {
      renderAuthNav();
      const id = qs("id");
      const content = document.getElementById("content");
      if (!id) {
        content.innerHTML = '<p class="status-line">No player specified.</p>';
        return;
      }
      try {
        const session = await getSession();
        const canViewReports = !!session || !window.REQUIRE_LOGIN_FOR_REPORTS;
        const [player, reports, career] = await Promise.all([
          fetchPlayer(id),
          canViewReports ? fetchReports(id) : Promise.resolve([]),
          fetchCareerStats(id),
        ]);
        if (!player) {
          content.innerHTML = '<p class="status-line">Player not found.</p>';
          return;
        }
        if (hmOnly) hmSplit = await fetchSplit(player.player_id, "vs_hm");
        renderPlayer(player, reports, canViewReports, career);
      } catch (e) {
        content.innerHTML = `<p class="status-line">Failed to load player: ${escapeHtml(e.message)}</p>`;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
