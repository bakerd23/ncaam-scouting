<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a Scouting Report</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>College Basketball Scouting Database</h1>
  </header>

  <main>
    <div class="card form-card">
      <h1 style="margin-top:0;">Submit a Scouting Report</h1>
      <p class="player-meta">Watched a player? Fill this out and it'll attach straight to their profile.</p>

      <form class="report-form" id="report-form">
        <div class="field">
          <label for="player-search">Player</label>
          <input type="text" id="player-search" placeholder="Start typing a player name..." autocomplete="off" />
          <div id="player-search-results" style="display:none;"></div>
          <div id="selected-player" style="display:none;" class="selected-player"></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="scout-name">Your name</label>
            <input type="text" id="scout-name" required />
          </div>
          <div class="field">
            <label for="date-watched">Date watched</label>
            <input type="date" id="date-watched" required />
          </div>
        </div>

        <div class="field">
          <label for="context">Context (game, event, practice, etc.)</label>
          <input type="text" id="context" placeholder="e.g. vs Duke 1/14, or Fall Practice" />
        </div>

        <div class="field">
          <label>Overall grade</label>
          <div class="star-rating" id="grade-stars" role="radiogroup" aria-label="Overall grade, 1 to 10"></div>
          <input type="hidden" id="overall-grade" />
        </div>

        <div class="field">
          <label>Projection</label>
          <div class="segmented" id="projection-segmented" role="radiogroup" aria-label="Projection">
            <button type="button" data-value="Priority">Priority</button>
            <button type="button" data-value="Depth">Depth</button>
            <button type="button" data-value="Monitor">Monitor</button>
            <button type="button" data-value="Pass">Pass</button>
          </div>
          <input type="hidden" id="projection" />
        </div>

        <div class="field">
          <label>Strengths <span class="field-hint">(tap what applies, or add your own)</span></label>
          <div class="chip-select" id="strengths-chips"></div>
          <div class="chip-add">
            <input type="text" id="strengths-custom" placeholder="Add another tag..." />
            <button type="button" class="btn secondary" id="strengths-add-btn">Add</button>
          </div>
        </div>

        <div class="field">
          <label for="weaknesses">Weaknesses</label>
          <textarea id="weaknesses" placeholder="Freeform notes work fine here too"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="confidence-slider">Confidence in this look</label>
            <div class="slider-row">
              <input type="range" id="confidence-slider" min="1" max="5" step="1" value="3" />
              <span class="slider-value" id="confidence-value">3</span>
            </div>
            <div class="slider-labels"><span>First look</span><span>Seen him a lot</span></div>
          </div>
          <div class="field">
            <label>Recommend for follow-up?</label>
            <div class="radio-group" id="recommend-radio">
              <label><input type="radio" name="recommend" value="Yes" /> Yes</label>
              <label><input type="radio" name="recommend" value="Maybe" /> Maybe</label>
              <label><input type="radio" name="recommend" value="No" /> No</label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="notes">Additional notes</label>
          <textarea id="notes"></textarea>
        </div>

        <div>
          <button type="submit" class="btn" id="submit-btn">Submit Report</button>
        </div>

        <div id="form-msg"></div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allPlayers = [];
    let selectedPlayer = null;

    // ---------- Player search ----------
    function showSelectedPlayer(p) {
      selectedPlayer = p;
      const el = document.getElementById("selected-player");
      el.style.display = "block";
      el.innerHTML = `Reporting on: <strong>${escapeHtml(p.name)}</strong> (${escapeHtml(p.school)}) &middot; <a href="#" id="clear-player">change</a>`;
      document.getElementById("player-search").style.display = "none";
      document.getElementById("player-search-results").style.display = "none";
      document.getElementById("clear-player").addEventListener("click", (e) => {
        e.preventDefault();
        selectedPlayer = null;
        el.style.display = "none";
        document.getElementById("player-search").style.display = "";
        document.getElementById("player-search").value = "";
        document.getElementById("player-search").focus();
      });
    }

    function renderSearchResults(matches) {
      const box = document.getElementById("player-search-results");
      if (matches.length === 0) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }
      box.style.display = "block";
      box.innerHTML = matches
        .slice(0, 25)
        .map(
          (p) =>
            `<div data-id="${escapeHtml(p.player_id)}">${escapeHtml(p.name)} <span class="player-meta">(${escapeHtml(p.school)})</span></div>`
        )
        .join("");
      box.querySelectorAll("div[data-id]").forEach((div) => {
        div.addEventListener("click", () => {
          const p = allPlayers.find((pl) => pl.player_id === div.dataset.id);
          if (p) showSelectedPlayer(p);
        });
      });
    }

    document.getElementById("player-search").addEventListener("input", (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (!term) {
        renderSearchResults([]);
        return;
      }
      const matches = allPlayers.filter((p) => p.name.toLowerCase().includes(term));
      renderSearchResults(matches);
    });

    // ---------- Star rating (overall grade, 1-10) ----------
    const starsContainer = document.getElementById("grade-stars");
    const gradeInput = document.getElementById("overall-grade");
    let currentGrade = 0;

    for (let i = 1; i <= 10; i++) {
      const star = document.createElement("button");
      star.type = "button";
      star.className = "star";
      star.dataset.value = i;
      star.setAttribute("aria-label", `${i} out of 10`);
      star.textContent = "★";
      starsContainer.appendChild(star);
    }

    function paintStars(upTo) {
      starsContainer.querySelectorAll(".star").forEach((s) => {
        s.classList.toggle("filled", Number(s.dataset.value) <= upTo);
      });
    }

    starsContainer.addEventListener("mousemove", (e) => {
      if (e.target.classList.contains("star")) paintStars(Number(e.target.dataset.value));
    });
    starsContainer.addEventListener("mouseleave", () => paintStars(currentGrade));
    starsContainer.addEventListener("click", (e) => {
      if (!e.target.classList.contains("star")) return;
      currentGrade = Number(e.target.dataset.value);
      gradeInput.value = currentGrade;
      paintStars(currentGrade);
    });

    // ---------- Segmented control (projection) ----------
    const segmented = document.getElementById("projection-segmented");
    const projectionInput = document.getElementById("projection");
    segmented.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      segmented.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      projectionInput.value = btn.dataset.value;
    });

    // ---------- Chip multi-select (strengths) ----------
    const STRENGTH_TAGS = [
      "Shooting", "Ball-Handling", "Passing", "Defense", "Rebounding",
      "Athleticism", "Basketball IQ", "Motor/Effort", "Length", "Leadership",
      "Finishing", "Free-Throw",
    ];
    const chipsContainer = document.getElementById("strengths-chips");
    const selectedChips = new Set();

    function renderChips() {
      chipsContainer.innerHTML = "";
      const allTags = [...new Set([...STRENGTH_TAGS, ...selectedChips])];
      allTags.forEach((tag) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (selectedChips.has(tag) ? " selected" : "");
        chip.textContent = tag;
        chip.addEventListener("click", () => {
          if (selectedChips.has(tag)) selectedChips.delete(tag);
          else selectedChips.add(tag);
          renderChips();
        });
        chipsContainer.appendChild(chip);
      });
    }
    renderChips();

    document.getElementById("strengths-add-btn").addEventListener("click", () => {
      const input = document.getElementById("strengths-custom");
      const val = input.value.trim();
      if (val) {
        selectedChips.add(val);
        input.value = "";
        renderChips();
      }
    });

    // ---------- Confidence slider ----------
    const confidenceSlider = document.getElementById("confidence-slider");
    const confidenceValue = document.getElementById("confidence-value");
    confidenceSlider.addEventListener("input", () => {
      confidenceValue.textContent = confidenceSlider.value;
    });

    // ---------- Submit ----------
    document.getElementById("report-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("form-msg");
      msg.innerHTML = "";

      if (!selectedPlayer) {
        msg.innerHTML = '<div class="msg error">Please select a player first.</div>';
        return;
      }

      const scoutName = document.getElementById("scout-name").value.trim();
      const dateWatched = document.getElementById("date-watched").value;
      if (!scoutName || !dateWatched) {
        msg.innerHTML = '<div class="msg error">Name and date watched are required.</div>';
        return;
      }

      const recommendEl = document.querySelector('input[name="recommend"]:checked');
      const report = {
        player_id: selectedPlayer.player_id,
        scout_name: scoutName,
        date_watched: dateWatched,
        context: document.getElementById("context").value.trim() || null,
        overall_grade: gradeInput.value ? Number(gradeInput.value) : null,
        projection: projectionInput.value || null,
        strengths: selectedChips.size ? [...selectedChips].join(", ") : null,
        weaknesses: document.getElementById("weaknesses").value.trim() || null,
        confidence_level: Number(confidenceSlider.value),
        would_recommend: recommendEl ? recommendEl.value : null,
        notes: document.getElementById("notes").value.trim() || null,
      };

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Submitting...";
      try {
        await submitReport(report);
        msg.innerHTML = '<div class="msg success">Report submitted. Thanks!</div>';
        document.getElementById("report-form").reset();
        selectedPlayer = null;
        document.getElementById("selected-player").style.display = "none";
        document.getElementById("player-search").style.display = "";
        currentGrade = 0;
        gradeInput.value = "";
        paintStars(0);
        segmented.querySelectorAll("button").forEach((b) => b.classList.remove("active"));
        projectionInput.value = "";
        selectedChips.clear();
        renderChips();
        confidenceSlider.value = 3;
        confidenceValue.textContent = "3";
      } catch (err) {
        msg.innerHTML = `<div class="msg error">Failed to submit: ${escapeHtml(err.message)}</div>`;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit Report";
      }
    });

    (async function init() {
      try {
        allPlayers = await fetchAllPlayers();
        const presetId = qs("id");
        if (presetId) {
          const p = allPlayers.find((pl) => pl.player_id === presetId);
          if (p) showSelectedPlayer(p);
        }
      } catch (e) {
        document.getElementById("form-msg").innerHTML =
          `<div class="msg error">Failed to load player list: ${escapeHtml(e.message)}</div>`;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
