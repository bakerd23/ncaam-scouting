<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a Scouting Report</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>College Basketball Scouting Database</h1>
  </header>

  <main>
    <div class="card form-card">
      <h1 style="margin-top:0;" id="form-title">Submit a Scouting Report</h1>
      <p class="player-meta" id="form-intro">Watched a player? Fill this out and it'll attach straight to their profile. You can come back and edit it later.</p>

      <form class="report-form" id="report-form">
        <div class="field">
          <label for="player-search">Player</label>
          <input type="text" id="player-search" placeholder="Start typing a player name..." autocomplete="off" />
          <div id="player-search-results" style="display:none;"></div>
          <div id="selected-player" style="display:none;" class="selected-player"></div>
          <div class="field-hint" id="add-player-hint" style="margin-top:6px;">
            Player not listed? <a href="#" id="add-player-link">Add him</a>
          </div>
          <div id="new-player" class="new-player" hidden>
            <strong>New player</strong>
            <div class="field-row">
              <div class="field">
                <label for="np-name">Name</label>
                <input type="text" id="np-name" autocomplete="off" />
              </div>
              <div class="field">
                <label for="np-school">School / team</label>
                <input type="text" id="np-school" placeholder="e.g. Montverde Academy" />
              </div>
            </div>
            <div id="np-dupes" class="dupe-warning"></div>
            <div class="field-row">
              <div class="field">
                <label for="np-level">Level</label>
                <select id="np-level">
                  <option value="">Choose...</option>
                  <option>High School</option>
                  <option>JUCO</option>
                  <option>D2/D3/NAIA</option>
                  <option>International</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="field">
                <label for="np-position">Position <span class="field-hint">(optional)</span></label>
                <input type="text" id="np-position" placeholder="G, F, C..." />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="np-class">Class / grad year <span class="field-hint">(optional)</span></label>
                <input type="text" id="np-class" placeholder="e.g. 2027, SO" />
              </div>
              <div class="field">
                <label for="np-height">Height <span class="field-hint">(optional)</span></label>
                <input type="text" id="np-height" placeholder="6'5&quot;" />
              </div>
            </div>
            <div class="field">
              <label for="np-hometown">Hometown <span class="field-hint">(optional)</span></label>
              <input type="text" id="np-hometown" />
            </div>
            <a href="#" id="cancel-add-player">Cancel - search for an existing player instead</a>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="scout-name">Your name</label>
            <input type="text" id="scout-name" required />
          </div>
          <div class="field">
            <label for="date-watched">Date watched</label>
            <input type="date" id="date-watched" required />
          </div>
        </div>

        <div class="field">
          <label for="context">Context (game, event, practice, etc.)</label>
          <input type="text" id="context" placeholder="e.g. vs Duke 1/14, or Fall Practice" />
        </div>

        <div class="field-row">
          <div class="field">
            <label for="parents">Parents</label>
            <textarea id="parents" data-column="parents"></textarea>
          </div>
          <div class="field">
            <label for="aau-coach">AAU Coach</label>
            <textarea id="aau-coach" data-column="aau_coach"></textarea>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="agent">Agent</label>
            <textarea id="agent" data-column="agent"></textarea>
          </div>
          <div class="field">
            <label for="finances">Finances</label>
            <textarea id="finances" data-column="finances"></textarea>
          </div>
        </div>

        <div class="field">
          <label for="success-reasons">Why he would be successful</label>
          <textarea id="success-reasons" data-column="success_reasons"></textarea>
        </div>

        <div class="field">
          <label for="failure-reasons">Why he wouldn't be successful</label>
          <textarea id="failure-reasons" data-column="failure_reasons"></textarea>
        </div>

        <div class="field">
          <label for="live-game-notes">Notes from live game play</label>
          <textarea id="live-game-notes" data-column="live_game_notes"></textarea>
        </div>

        <div>
          <button type="submit" class="btn" id="submit-btn">Submit Report</button>
        </div>

        <div id="form-msg"></div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allPlayers = [];
    let selectedPlayer = null;
    const editingId = qs("edit"); // report.html?edit=<report id> reopens a report to finish it

    // ---------- Player search ----------
    function showSelectedPlayer(p) {
      selectedPlayer = p;
      const el = document.getElementById("selected-player");
      el.style.display = "block";
      el.innerHTML = `Reporting on: <strong>${escapeHtml(p.name)}</strong> (${escapeHtml(p.school)}${levelTag(p)})` +
        (editingId ? "" : ' &middot; <a href="#" id="clear-player">change</a>');
      setAddingPlayer(false);
      document.getElementById("add-player-hint").style.display = "none";
      document.getElementById("player-search").style.display = "none";
      document.getElementById("player-search-results").style.display = "none";
      if (editingId) return; // the player stays fixed when editing
      document.getElementById("clear-player").addEventListener("click", (e) => {
        e.preventDefault();
        selectedPlayer = null;
        el.style.display = "none";
        document.getElementById("add-player-hint").style.display = "";
        document.getElementById("player-search").style.display = "";
        document.getElementById("player-search").value = "";
        document.getElementById("player-search").focus();
      });
    }

    // ---------- Player not listed: add him ----------
    let addingPlayer = false;

    function setAddingPlayer(on) {
      addingPlayer = on;
      document.getElementById("new-player").hidden = !on;
      document.getElementById("add-player-hint").style.display = on ? "none" : "";
      document.getElementById("player-search").style.display = on ? "none" : "";
      document.getElementById("player-search-results").style.display = "none";
      if (on) {
        // Carry over whatever was typed into the search box.
        const typed = document.getElementById("player-search").value.trim();
        if (typed && !document.getElementById("np-name").value) {
          document.getElementById("np-name").value = typed;
        }
        checkDupes();
        document.getElementById("np-name").focus();
      }
    }

    function normName(s) {
      return (s || "").toLowerCase().replace(/[^a-z]/g, "");
    }

    // Before creating a new player, point out anyone already in the database with that name -
    // a JUCO or D1 player shouldn't get a second, stat-less row.
    function checkDupes() {
      const box = document.getElementById("np-dupes");
      const key = normName(document.getElementById("np-name").value);
      const matches = key.length < 4 ? [] : allPlayers.filter((p) => normName(p.name) === key).slice(0, 4);
      box.innerHTML = matches.length
        ? "Already in the database - is it one of these?<br>" +
          matches
            .map(
              (p) =>
                `<button type="button" class="btn secondary" data-id="${escapeHtml(p.player_id)}">${escapeHtml(p.name)} (${escapeHtml(p.school)}${levelTag(p)})</button>`
            )
            .join("")
        : "";
      box.querySelectorAll("button[data-id]").forEach((b) => {
        b.addEventListener("click", () => {
          const p = allPlayers.find((pl) => pl.player_id === b.dataset.id);
          if (p) showSelectedPlayer(p);
        });
      });
    }

    document.getElementById("add-player-link").addEventListener("click", (e) => {
      e.preventDefault();
      setAddingPlayer(true);
    });
    document.getElementById("cancel-add-player").addEventListener("click", (e) => {
      e.preventDefault();
      setAddingPlayer(false);
    });
    document.getElementById("np-name").addEventListener("input", checkDupes);

    function renderSearchResults(matches) {
      const box = document.getElementById("player-search-results");
      if (matches.length === 0) {
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }
      box.style.display = "block";
      box.innerHTML = matches
        .slice(0, 25)
        .map(
          (p) =>
            `<div data-id="${escapeHtml(p.player_id)}">${escapeHtml(p.name)} <span class="player-meta">(${escapeHtml(p.school)}${levelTag(p)})</span></div>`
        )
        .join("");
      box.querySelectorAll("div[data-id]").forEach((div) => {
        div.addEventListener("click", () => {
          const p = allPlayers.find((pl) => pl.player_id === div.dataset.id);
          if (p) showSelectedPlayer(p);
        });
      });
    }

    document.getElementById("player-search").addEventListener("input", (e) => {
      const term = e.target.value.trim().toLowerCase();
      if (!term) {
        renderSearchResults([]);
        return;
      }
      const matches = allPlayers.filter((p) => p.name.toLowerCase().includes(term));
      renderSearchResults(matches);
    });

    // ---------- Submit ----------
    document.getElementById("report-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("form-msg");
      msg.innerHTML = "";
      if (editingId) return saveEdit(msg);

      const newPlayer = addingPlayer
        ? {
            name: document.getElementById("np-name").value.trim(),
            school: document.getElementById("np-school").value.trim(),
            added_level: document.getElementById("np-level").value,
            position: document.getElementById("np-position").value.trim() || null,
            class: document.getElementById("np-class").value.trim() || null,
            height: document.getElementById("np-height").value.trim() || null,
            hometown: document.getElementById("np-hometown").value.trim() || null,
          }
        : null;
      if (!selectedPlayer && !newPlayer) {
        msg.innerHTML = '<div class="msg error">Please select a player first, or add him if he isn\'t listed.</div>';
        return;
      }
      if (newPlayer && (!newPlayer.name || !newPlayer.school || !newPlayer.added_level)) {
        msg.innerHTML = '<div class="msg error">The new player needs a name, school/team and level.</div>';
        return;
      }

      const scoutName = document.getElementById("scout-name").value.trim();
      const dateWatched = document.getElementById("date-watched").value;
      if (!scoutName || !dateWatched) {
        msg.innerHTML = '<div class="msg error">Name and date watched are required.</div>';
        return;
      }

      const report = {
        player_id: selectedPlayer ? selectedPlayer.player_id : null,
        scout_name: scoutName,
        date_watched: dateWatched,
        context: document.getElementById("context").value.trim() || null,
      };
      // Each free-text box maps straight to the reports column named in its data-column.
      document.querySelectorAll("#report-form [data-column]").forEach((el) => {
        report[el.dataset.column] = el.value.trim() || null;
      });

      // Ids are fixed now so a later retry (from the offline outbox) can't double-save.
      const item = { report: { ...report, id: crypto.randomUUID() }, newPlayer: null, savedAt: new Date().toISOString() };
      if (newPlayer) {
        // Player first, so the report has something to attach to.
        item.newPlayer = newPlayerRow({ ...newPlayer, added_by: scoutName });
        item.report.player_id = item.newPlayer.player_id;
      }
      const playerName = item.newPlayer ? item.newPlayer.name : selectedPlayer.name;

      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Submitting...";
      try {
        if (!navigator.onLine) throw new TypeError("Failed to fetch"); // skip the wait
        await sendReport(item);
        const added = item.newPlayer;
        if (added) allPlayers.push(added);
        const editMore = `<a href="report.html?edit=${encodeURIComponent(item.report.id)}">Keep editing it</a>`;
        msg.innerHTML = added
          ? `<div class="msg success">Report submitted, and <a href="${playerLink(added.player_id)}">${escapeHtml(added.name)}</a> was added to the database (Players &rarr; Added). ${editMore}, or reopen it later from his page.</div>`
          : `<div class="msg success">Report submitted. ${editMore}, or reopen it later from <a href="${playerLink(item.report.player_id)}">his page</a>.</div>`;
        resetReportForm();
      } catch (err) {
        if (isNetworkError(err)) {
          try {
            queueReport(item);
            msg.innerHTML = `<div class="msg success">No connection - your report on ${escapeHtml(playerName)} is saved on this device and will send automatically when you're back online. Don't clear your browser data until it does.</div>`;
            resetReportForm();
            renderOutboxBanner();
          } catch (storageErr) {
            msg.innerHTML = '<div class="msg error">No connection, and this browser wouldn\'t let the report be saved on the device. Keep this tab open and press Submit again once you have signal.</div>';
          }
        } else {
          msg.innerHTML = `<div class="msg error">Failed to submit: ${escapeHtml(err.message)}</div>`;
        }
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Submit Report";
      }
    });

    // ---------- Edit an existing report ----------
    function reportFields() {
      const fields = {
        scout_name: document.getElementById("scout-name").value.trim(),
        date_watched: document.getElementById("date-watched").value,
        context: document.getElementById("context").value.trim() || null,
      };
      document.querySelectorAll("#report-form [data-column]").forEach((el) => {
        fields[el.dataset.column] = el.value.trim() || null;
      });
      return fields;
    }

    async function saveEdit(msg) {
      const fields = reportFields();
      if (!fields.scout_name || !fields.date_watched) {
        msg.innerHTML = '<div class="msg error">Name and date watched are required.</div>';
        return;
      }
      const btn = document.getElementById("submit-btn");
      btn.disabled = true;
      btn.textContent = "Saving...";
      try {
        await updateReport(editingId, fields);
        msg.innerHTML = `<div class="msg success">Changes saved (${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}). <a href="${playerLink(selectedPlayer.player_id)}">Back to ${escapeHtml(selectedPlayer.name)}</a></div>`;
      } catch (err) {
        msg.innerHTML = isNetworkError(err)
          ? '<div class="msg error">No connection - your changes aren\'t saved yet. Keep this tab open and press Save again once you have signal.</div>'
          : `<div class="msg error">Failed to save: ${escapeHtml(err.message)}</div>`;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = "Save Changes";
      }
    }

    async function loadForEdit() {
      document.title = "Edit Scouting Report";
      document.getElementById("form-title").textContent = "Edit Scouting Report";
      document.getElementById("form-intro").textContent = "Pick up where you left off - Save Changes as often as you like.";
      document.getElementById("submit-btn").textContent = "Save Changes";
      const r = await fetchReport(editingId);
      if (!r) throw new Error("that report wasn't found");
      const p = allPlayers.find((pl) => pl.player_id === r.player_id);
      showSelectedPlayer(p || { player_id: r.player_id, name: "Unknown player", school: "" });
      document.getElementById("scout-name").value = r.scout_name || "";
      document.getElementById("date-watched").value = r.date_watched || "";
      document.getElementById("context").value = r.context || "";
      document.querySelectorAll("#report-form [data-column]").forEach((el) => {
        el.value = r[el.dataset.column] || "";
      });
    }

    // New reports start on today's date (the device's local day, not UTC - a report written
    // at 9pm shouldn't land on tomorrow).
    function setDateToToday() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      document.getElementById("date-watched").value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function resetReportForm() {
      document.getElementById("report-form").reset();
      setDateToToday();
      selectedPlayer = null;
      setAddingPlayer(false);
      document.getElementById("np-dupes").innerHTML = "";
      document.getElementById("selected-player").style.display = "none";
      document.getElementById("add-player-hint").style.display = "";
      document.getElementById("player-search").style.display = "";
    }

    (async function init() {
      if (!editingId) setDateToToday(); // an edited report keeps its own date
      try {
        allPlayers = await fetchAllPlayers();
        if (editingId) return await loadForEdit();
        const presetId = qs("id");
        if (presetId) {
          const p = allPlayers.find((pl) => pl.player_id === presetId);
          if (p) showSelectedPlayer(p);
        }
      } catch (e) {
        document.getElementById("form-msg").innerHTML =
          `<div class="msg error">Failed to load ${editingId ? "the report" : "player list"}: ${escapeHtml(e.message)}</div>`;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
