<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Database</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>College Basketball Scouting Database</h1>
    <nav>
      <a href="index.html">Players</a>
      <a href="report.html">Submit a Report</a>
      <span id="auth-nav-slot"></span>
    </nav>
  </header>

  <main class="wide">
    <div class="controls">
      <input type="text" id="search" class="search-box" placeholder="Search player name..." />
      <select id="filter-conference"><option value="">All Conferences</option></select>
      <select id="filter-school"><option value="">All Schools</option></select>
      <select id="filter-position"><option value="">All Positions</option></select>
      <select id="filter-class"><option value="">All Classes</option></select>
      <button class="btn secondary" id="add-filter-btn" type="button" aria-expanded="false" aria-controls="filter-panel">Filters</button>
      <button class="btn secondary" id="hm-toggle" type="button" aria-pressed="false"
        title="Only count games vs ACC, Big Ten, Big East, Big 12, SEC, Pac-12, Mountain West, A-10, American and MVC opponents">vs High/Mid Major Only</button>
    </div>

    <div id="filter-panel" class="filter-panel" hidden></div>

    <div class="status-line" id="status-line">Loading players...</div>

    <div style="overflow-x:auto;">
      <table id="players-table">
        <thead>
          <tr>
            <th data-sort="name">Player</th>
            <th data-sort="school">School</th>
            <th data-sort="conference">Conference</th>
            <th data-sort="position">Pos</th>
            <th data-sort="class">Class</th>
            <th data-sort="gp" title="Games played">GP</th>
            <th data-sort="min" title="Minutes per game">MPG</th>
            <th data-sort="ppg">PPG</th>
            <th data-sort="rpg">RPG</th>
            <th data-sort="apg">APG</th>
            <th data-sort="spg">SPG</th>
            <th data-sort="bpg">BPG</th>
            <th data-sort="fg_pct">FG%</th>
            <th data-sort="three_pct">3P%</th>
            <th data-sort="ft_pct">FT%</th>
            <th data-sort="orb_pct" title="Offensive Rebound Rate: % of available offensive rebounds grabbed while on the floor (2025-26)">ORB%</th>
            <th data-sort="drb_pct" title="Defensive Rebound Rate: % of available defensive rebounds grabbed while on the floor (2025-26)">DRB%</th>
            <th data-sort="stl_pct" title="Steal Rate: % of opponent possessions ending in a steal by the player while on the floor (2025-26)">STL%</th>
            <th data-sort="blk_pct" title="Block Rate: % of opponent 2-point attempts blocked by the player while on the floor (2025-26)">BLK%</th>
            <th data-sort="ft_rate" title="Free Throw Rate: free throw attempts per 100 field goal attempts (2025-26)">FTr</th>
            <th data-sort="report_count">Reports</th>
          </tr>
        </thead>
        <tbody id="players-tbody"></tbody>
      </table>
    </div>
    <div id="rows-sentinel" aria-hidden="true"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allPlayers = [];
    let basePlayers = []; // players as loaded, with full-season stats
    let hmSplits = null; // player_id -> "vs_hm" split row
    // Started in the background as soon as the player list is up, so the toggle is usually
    // instant; a click before it finishes just waits on the same request.
    let hmSplitsPromise = null;

    function loadHmSplits() {
      if (!hmSplitsPromise) {
        hmSplitsPromise = fetchAllSplits("vs_hm").catch((err) => {
          hmSplitsPromise = null; // let the next click retry
          throw err;
        });
      }
      return hmSplitsPromise;
    }
    let hmOnly = false;
    let sortKey = "name";
    let sortAsc = true;
    let dynamicFilters = [];
    let canViewReports = true;

    // Every filterable column, shown all at once in the Filters panel: give any of them a
    // comparison and a value to filter on it. Height/weight/record need string-to-number
    // parsing since they're stored as raw ESPN text.
    const STAT_OPTIONS = [
      { value: "position", label: "Position", type: "string", group: "Player", hint: "G" },
      { value: "class", label: "Class", type: "string", group: "Player", hint: "SR" },
      { value: "height", label: "Height", type: "height", group: "Player", hint: "6'5\"" },
      { value: "weight", label: "Weight", type: "weight", group: "Player", hint: "200" },
      { value: "record", label: "Team Win %", type: "record", group: "Player", hint: "0.600" },
      { value: "gp", label: "Games Played", type: "number", group: "Per Game" },
      { value: "min", label: "Minutes", type: "number", group: "Per Game" },
      { value: "ppg", label: "Points", type: "number", group: "Per Game" },
      { value: "rpg", label: "Rebounds", type: "number", group: "Per Game" },
      { value: "apg", label: "Assists", type: "number", group: "Per Game" },
      { value: "spg", label: "Steals", type: "number", group: "Per Game" },
      { value: "bpg", label: "Blocks", type: "number", group: "Per Game" },
      { value: "topg", label: "Turnovers", type: "number", group: "Per Game" },
      { value: "fg_pct", label: "FG%", type: "number", group: "Shooting", hint: "45" },
      { value: "three_pct", label: "3P%", type: "number", group: "Shooting", hint: "35" },
      { value: "ft_pct", label: "FT%", type: "number", group: "Shooting", hint: "75" },
      { value: "orb_pct", label: "ORB%", type: "number", group: "Advanced" },
      { value: "drb_pct", label: "DRB%", type: "number", group: "Advanced" },
      { value: "stl_pct", label: "STL%", type: "number", group: "Advanced" },
      { value: "blk_pct", label: "BLK%", type: "number", group: "Advanced" },
      { value: "ft_rate", label: "FT Rate", type: "number", group: "Advanced" },
      { value: "report_count", label: "Reports", type: "number", group: "Reports" },
    ];

    function populateFilterOptions() {
      const conferences = [...new Set(allPlayers.map((p) => p.conference).filter(Boolean))].sort();
      const schools = [...new Set(allPlayers.map((p) => p.school).filter(Boolean))].sort();
      const positions = [...new Set(allPlayers.map((p) => p.position).filter(Boolean))].sort();
      const classes = [...new Set(allPlayers.map((p) => p.class).filter(Boolean))].sort();

      const fill = (id, values, label = (v) => v) => {
        const el = document.getElementById(id);
        for (const v of values) {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = label(v);
          el.appendChild(opt);
        }
      };
      fill(
        "filter-conference",
        conferences.sort((a, b) => shortConference(a).localeCompare(shortConference(b))),
        shortConference
      );
      fill("filter-school", schools);
      fill("filter-position", positions);
      fill("filter-class", classes);
    }

    function comparisonOptionsFor(type) {
      if (type === "string") return [["=", "="], ["!=", "≠"]];
      return [
        [">=", "≥"],
        ["<=", "≤"],
        ["=", "="],
        [">", ">"],
        ["<", "<"],
      ];
    }

    // One filter per column, all visible at once; a column only filters once its value box
    // has something in it.
    function buildFilterPanel() {
      const panel = document.getElementById("filter-panel");
      const groups = [...new Set(STAT_OPTIONS.map((o) => o.group))];
      panel.innerHTML =
        groups
          .map(
            (g) => `
        <fieldset class="filter-group">
          <legend>${g}</legend>
          ${STAT_OPTIONS.filter((o) => o.group === g)
            .map(
              (o) => `
          <div class="filter-line" data-stat="${o.value}">
            <label for="flt-${o.value}">${o.label}</label>
            <select data-role="comparison" aria-label="${o.label} comparison">
              ${comparisonOptionsFor(o.type).map(([v, label]) => `<option value="${v}">${label}</option>`).join("")}
            </select>
            <input type="text" id="flt-${o.value}" data-role="value" placeholder="${escapeHtml(o.hint || "")}" />
          </div>`
            )
            .join("")}
        </fieldset>`
          )
          .join("") +
        `<div class="filter-panel-actions"><button type="button" class="btn secondary" id="clear-filters-btn">Clear all</button></div>`;

      dynamicFilters = STAT_OPTIONS.map((o) => ({
        stat: o.value,
        comparison: comparisonOptionsFor(o.type)[0][0],
        value: "",
      }));

      panel.querySelectorAll(".filter-line").forEach((line) => {
        const f = dynamicFilters.find((x) => x.stat === line.dataset.stat);
        const comparison = line.querySelector('[data-role="comparison"]');
        const value = line.querySelector('[data-role="value"]');
        const sync = () => {
          f.comparison = comparison.value;
          f.value = value.value.trim();
          line.classList.toggle("active", f.value !== "");
          updateFilterButton();
          applyFiltersAndSort();
        };
        comparison.addEventListener("change", sync);
        value.addEventListener("input", sync);
      });

      document.getElementById("clear-filters-btn").addEventListener("click", () => {
        panel.querySelectorAll(".filter-line").forEach((line) => {
          line.querySelector('[data-role="comparison"]').selectedIndex = 0;
          line.querySelector('[data-role="value"]').value = "";
          line.classList.remove("active");
        });
        for (const f of dynamicFilters) {
          f.comparison = comparisonOptionsFor(STAT_OPTIONS.find((o) => o.value === f.stat).type)[0][0];
          f.value = "";
        }
        updateFilterButton();
        applyFiltersAndSort();
      });
    }

    function updateFilterButton() {
      const n = dynamicFilters.filter((f) => f.value !== "").length;
      document.getElementById("add-filter-btn").textContent = n ? `Filters (${n})` : "Filters";
    }

    document.getElementById("add-filter-btn").addEventListener("click", (e) => {
      const panel = document.getElementById("filter-panel");
      panel.hidden = !panel.hidden;
      e.currentTarget.setAttribute("aria-expanded", String(!panel.hidden));
    });
    buildFilterPanel();

    const NAME_SUFFIXES = new Set(["jr", "sr", "ii", "iii", "iv", "v"]);
    function lastNameOf(fullName) {
      if (!fullName) return "";
      const parts = fullName.trim().split(/\s+/);
      let idx = parts.length - 1;
      while (idx > 0 && NAME_SUFFIXES.has(parts[idx].toLowerCase().replace(/\.$/, ""))) {
        idx--;
      }
      return parts[idx] || "";
    }

    function heightToInches(raw) {
      if (!raw) return NaN;
      const m = String(raw).match(/(\d+)'?\s*(\d+)?/);
      if (!m) return NaN;
      return (parseInt(m[1], 10) || 0) * 12 + (parseInt(m[2], 10) || 0);
    }

    function weightToLbs(raw) {
      if (!raw) return NaN;
      const m = String(raw).match(/(\d+)/);
      return m ? parseInt(m[1], 10) : NaN;
    }

    function recordToWinPct(raw) {
      if (!raw) return NaN;
      const parts = String(raw).split("-");
      if (parts.length !== 2) return NaN;
      const w = parseInt(parts[0], 10);
      const l = parseInt(parts[1], 10);
      if (Number.isNaN(w) || Number.isNaN(l) || w + l === 0) return NaN;
      return w / (w + l);
    }

    function compareNumbers(playerValue, comparison, filterValue) {
      if (Number.isNaN(playerValue) || Number.isNaN(filterValue)) return false;
      switch (comparison) {
        case ">=":
          return playerValue >= filterValue;
        case "<=":
          return playerValue <= filterValue;
        case "=":
          return Math.abs(playerValue - filterValue) < 0.01;
        case ">":
          return playerValue > filterValue;
        case "<":
          return playerValue < filterValue;
        default:
          return true;
      }
    }

    function playerMatchesDynamicFilter(p, f) {
      if (!f.value) return true;
      const opt = STAT_OPTIONS.find((o) => o.value === f.stat);
      const type = opt ? opt.type : "number";

      if (type === "string") {
        const pv = (p[f.stat] ?? "").toString().toLowerCase();
        const fv = f.value.toLowerCase();
        return f.comparison === "!=" ? pv !== fv : pv === fv;
      }
      if (type === "height") {
        return compareNumbers(heightToInches(p.height), f.comparison, heightToInches(f.value) || parseFloat(f.value));
      }
      if (type === "weight") {
        return compareNumbers(weightToLbs(p.weight), f.comparison, parseFloat(f.value));
      }
      if (type === "record") {
        return compareNumbers(recordToWinPct(p.record), f.comparison, parseFloat(f.value));
      }
      return compareNumbers(parseFloat(p[f.stat]), f.comparison, parseFloat(f.value));
    }

    function currentFilters() {
      return {
        search: document.getElementById("search").value.trim().toLowerCase(),
        conference: document.getElementById("filter-conference").value,
        school: document.getElementById("filter-school").value,
        position: document.getElementById("filter-position").value,
        cls: document.getElementById("filter-class").value,
      };
    }

    function applyFiltersAndSort() {
      const f = currentFilters();
      let rows = allPlayers.filter((p) => {
        if (f.conference && p.conference !== f.conference) return false;
        if (f.search && !p.name.toLowerCase().includes(f.search)) return false;
        if (f.school && p.school !== f.school) return false;
        if (f.position && p.position !== f.position) return false;
        if (f.cls && p.class !== f.cls) return false;
        return dynamicFilters.every((df) => playerMatchesDynamicFilter(p, df));
      });

      rows.sort((a, b) => {
        const av = sortKey === "name" ? lastNameOf(a.name) : a[sortKey];
        const bv = sortKey === "name" ? lastNameOf(b.name) : b[sortKey];
        const an = av === null || av === undefined;
        const bn = bv === null || bv === undefined;
        if (an && bn) return 0;
        if (an) return 1;
        if (bn) return -1;
        if (typeof av === "number" || typeof bv === "number") {
          return sortAsc ? av - bv : bv - av;
        }
        return sortAsc
          ? String(av).localeCompare(String(bv))
          : String(bv).localeCompare(String(av));
      });

      renderRows(rows);
      document.getElementById("status-line").textContent =
        `${rows.length} of ${allPlayers.length} players` +
        (hmOnly ? " · stats from games vs High/Mid Major opponents only" : "");
    }

    function renderReportCountCell(count) {
      if (!canViewReports) return '<span class="player-meta">—</span>';
      const n = count || 0;
      const cls = n > 0 ? "report-count-pill" : "report-count-pill zero";
      return `<span class="${cls}">${n}</span>`;
    }

    // Rolling render: laying out all ~5,700 rows at once took the browser ~1.5s on every sort,
    // filter or toggle. Instead the first ROW_CHUNK rows go in right away and the next chunk
    // is appended whenever the sentinel under the table gets within ROW_PRELOAD_PX of the
    // bottom of the screen - far enough ahead that scrolling never reaches an empty table.
    const ROW_CHUNK = 200;
    const ROW_PRELOAD_PX = 1500;
    let renderedRows = [];
    let renderedCount = 0;

    function rowHtml(p) {
      return `
        <tr onclick="window.location.href='${playerLink(p.player_id, hmOnly)}'">
          <td>${escapeHtml(p.name)}</td>
          <td>${escapeHtml(p.school)}</td>
          <td title="${escapeHtml(p.conference)}">${escapeHtml(shortConference(p.conference))}</td>
          <td>${escapeHtml(p.position)}</td>
          <td>${escapeHtml(p.class)}</td>
          <td>${fmtStat(p.gp, 0)}</td>
          <td>${fmtStat(p.min)}</td>
          <td>${fmtStat(p.ppg)}</td>
          <td>${fmtStat(p.rpg)}</td>
          <td>${fmtStat(p.apg)}</td>
          <td>${fmtStat(p.spg)}</td>
          <td>${fmtStat(p.bpg)}</td>
          <td>${fmtPct(p.fg_pct)}</td>
          <td>${fmtPct(p.three_pct)}</td>
          <td>${fmtPct(p.ft_pct)}</td>
          <td>${fmtPct(p.orb_pct)}</td>
          <td>${fmtPct(p.drb_pct)}</td>
          <td>${fmtPct(p.stl_pct)}</td>
          <td>${fmtPct(p.blk_pct)}</td>
          <td>${fmtStat(p.ft_rate)}</td>
          <td>${renderReportCountCell(p.report_count)}</td>
        </tr>`;
    }

    function sentinelIsNear() {
      const top = document.getElementById("rows-sentinel").getBoundingClientRect().top;
      return top < window.innerHeight + ROW_PRELOAD_PX;
    }

    // Appends chunks until the sentinel is comfortably below the screen (or rows run out).
    // Looping here matters: the observer only fires when the sentinel *enters* the preload
    // zone, so if one chunk isn't enough to push it back out, nothing would fire again.
    function renderMoreRows() {
      const tbody = document.getElementById("players-tbody");
      while (renderedCount < renderedRows.length && sentinelIsNear()) {
        const next = renderedRows.slice(renderedCount, renderedCount + ROW_CHUNK);
        tbody.insertAdjacentHTML("beforeend", next.map(rowHtml).join(""));
        renderedCount += next.length;
      }
    }

    function renderRows(rows) {
      renderedRows = rows;
      renderedCount = 0;
      document.getElementById("players-tbody").innerHTML = "";
      renderMoreRows();
    }

    new IntersectionObserver(
      (entries) => {
        if (entries.some((e) => e.isIntersecting)) renderMoreRows();
      },
      { rootMargin: `0px 0px ${ROW_PRELOAD_PX}px 0px` }
    ).observe(document.getElementById("rows-sentinel"));

    function updateSortHeaders() {
      document.querySelectorAll("th[data-sort]").forEach((th) => {
        th.classList.remove("sorted", "sorted-asc");
        if (th.dataset.sort === sortKey) {
          th.classList.add(sortAsc ? "sorted-asc" : "sorted");
        }
      });
    }

    // Text columns start A-Z on their first click; every other (stat) column starts with the
    // highest values on top. A second click on the same column flips it.
    const TEXT_SORT_KEYS = new Set(["name", "school", "conference", "position", "class"]);

    document.querySelectorAll("th[data-sort]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortAsc = !sortAsc;
        } else {
          sortKey = key;
          sortAsc = TEXT_SORT_KEYS.has(key);
        }
        updateSortHeaders();
        applyFiltersAndSort();
      });
    });

    document.getElementById("hm-toggle").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      if (!hmSplits) {
        btn.disabled = true;
        try {
          hmSplits = await loadHmSplits();
        } catch (err) {
          document.getElementById("status-line").textContent =
            "Failed to load High/Mid Major stats: " + err.message;
          console.error(err);
          return;
        } finally {
          btn.disabled = false;
        }
      }
      hmOnly = !hmOnly;
      btn.setAttribute("aria-pressed", String(hmOnly));
      allPlayers = hmOnly
        ? basePlayers.map((p) => withSplitStats(p, hmSplits[p.player_id]))
        : basePlayers;
      applyFiltersAndSort();
    });

    ["search", "filter-conference", "filter-school", "filter-position", "filter-class"].forEach(
      (id) => {
        document.getElementById(id).addEventListener("input", applyFiltersAndSort);
      }
    );

    (async function init() {
      renderAuthNav();
      try {
        const session = await getSession();
        canViewReports = !!session || !window.REQUIRE_LOGIN_FOR_REPORTS;
        const [players, reportCounts] = await Promise.all([
          fetchAllPlayers(),
          canViewReports ? fetchReportCounts() : Promise.resolve({}),
        ]);
        basePlayers = players.map((p) => ({
          ...p,
          report_count: reportCounts[p.player_id] || 0,
        }));
        allPlayers = basePlayers;
        populateFilterOptions();
        updateSortHeaders();
        applyFiltersAndSort();
        loadHmSplits().catch((err) => console.error(err)); // background preload
      } catch (e) {
        document.getElementById("status-line").textContent =
          "Failed to load players: " + e.message;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
