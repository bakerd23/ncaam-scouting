<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Database</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1>College Basketball Scouting Database</h1>
    <nav>
      <a href="index.html">Players</a>
      <a href="report.html">Submit a Report</a>
    </nav>
  </header>

  <main>
    <div class="conference-tabs" id="conference-tabs"></div>

    <div class="controls">
      <input type="text" id="search" class="search-box" placeholder="Search player name..." />
      <select id="filter-school"><option value="">All Schools</option></select>
      <select id="filter-position"><option value="">All Positions</option></select>
      <select id="filter-class"><option value="">All Classes</option></select>
      <button class="btn secondary" id="add-filter-btn" type="button">+ Add Filter</button>
    </div>

    <div id="active-filters" class="active-filters"></div>

    <div class="status-line" id="status-line">Loading players...</div>

    <div style="overflow-x:auto;">
      <table id="players-table">
        <thead>
          <tr>
            <th data-sort="name">Player</th>
            <th data-sort="school">School</th>
            <th data-sort="conference">Conference</th>
            <th data-sort="position">Pos</th>
            <th data-sort="class">Class</th>
            <th data-sort="ppg">PPG</th>
            <th data-sort="rpg">RPG</th>
            <th data-sort="apg">APG</th>
            <th data-sort="spg">SPG</th>
            <th data-sort="bpg">BPG</th>
            <th data-sort="fg_pct">FG%</th>
            <th data-sort="three_pct">3P%</th>
            <th data-sort="ft_pct">FT%</th>
          </tr>
        </thead>
        <tbody id="players-tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    let allPlayers = [];
    let sortKey = "name";
    let sortAsc = true;
    let currentConference = "All";
    let dynamicFilters = [];
    let filterIdCounter = 0;

    // Ported from the Moats/transfer-portal roster board's dynamic filter builder: pick a
    // stat, a comparison, and a value, stack as many as you want. Height/weight/record need
    // the same string-to-number parsing there since they're stored as raw ESPN text.
    const STAT_OPTIONS = [
      { value: "position", label: "Position", type: "string" },
      { value: "class", label: "Class", type: "string" },
      { value: "height", label: "Height", type: "height" },
      { value: "weight", label: "Weight", type: "weight" },
      { value: "record", label: "Win %", type: "record" },
      { value: "gp", label: "Games Played", type: "number" },
      { value: "min", label: "Minutes", type: "number" },
      { value: "ppg", label: "Points", type: "number" },
      { value: "rpg", label: "Rebounds", type: "number" },
      { value: "apg", label: "Assists", type: "number" },
      { value: "spg", label: "Steals", type: "number" },
      { value: "bpg", label: "Blocks", type: "number" },
      { value: "topg", label: "Turnovers", type: "number" },
      { value: "fg_pct", label: "FG%", type: "number" },
      { value: "three_pct", label: "3P%", type: "number" },
      { value: "ft_pct", label: "FT%", type: "number" },
    ];

    function populateFilterOptions() {
      const schools = [...new Set(allPlayers.map((p) => p.school).filter(Boolean))].sort();
      const positions = [...new Set(allPlayers.map((p) => p.position).filter(Boolean))].sort();
      const classes = [...new Set(allPlayers.map((p) => p.class).filter(Boolean))].sort();

      const fill = (id, values) => {
        const el = document.getElementById(id);
        for (const v of values) {
          const opt = document.createElement("option");
          opt.value = v;
          opt.textContent = v;
          el.appendChild(opt);
        }
      };
      fill("filter-school", schools);
      fill("filter-position", positions);
      fill("filter-class", classes);
    }

    function renderConferenceTabs() {
      const conferences = [...new Set(allPlayers.map((p) => p.conference).filter(Boolean))].sort();
      const container = document.getElementById("conference-tabs");
      const makeBtn = (label) => {
        const btn = document.createElement("button");
        btn.textContent = label;
        btn.className = label === currentConference ? "active" : "";
        btn.addEventListener("click", () => {
          currentConference = label;
          renderConferenceTabs();
          applyFiltersAndSort();
        });
        return btn;
      };
      container.innerHTML = "";
      container.appendChild(makeBtn("All"));
      conferences.forEach((c) => container.appendChild(makeBtn(c)));
    }

    function addFilterRow() {
      const id = filterIdCounter++;
      dynamicFilters.push({ id, stat: "ppg", comparison: ">=", value: "" });

      const row = document.createElement("div");
      row.className = "filter-row";
      row.id = `filter-${id}`;
      row.innerHTML = `
        <select data-role="stat">
          ${STAT_OPTIONS.map((o) => `<option value="${o.value}">${o.label}</option>`).join("")}
        </select>
        <select data-role="comparison"></select>
        <input type="text" data-role="value" placeholder="Value" />
        <button type="button" data-role="remove">Remove</button>
      `;
      document.getElementById("active-filters").appendChild(row);

      const statSelect = row.querySelector('[data-role="stat"]');
      const comparisonSelect = row.querySelector('[data-role="comparison"]');
      const valueInput = row.querySelector('[data-role="value"]');

      function comparisonOptionsFor(type) {
        if (type === "string") return [["=", "="], ["!=", "≠"]];
        return [
          [">=", "≥"],
          ["<=", "≤"],
          ["=", "="],
          [">", ">"],
          ["<", "<"],
        ];
      }

      function refreshComparisonOptions() {
        const opt = STAT_OPTIONS.find((o) => o.value === statSelect.value);
        const options = comparisonOptionsFor(opt ? opt.type : "number");
        comparisonSelect.innerHTML = options
          .map(([v, label]) => `<option value="${v}">${label}</option>`)
          .join("");
      }
      refreshComparisonOptions();

      const sync = () => {
        const f = dynamicFilters.find((x) => x.id === id);
        f.stat = statSelect.value;
        f.comparison = comparisonSelect.value;
        f.value = valueInput.value;
        applyFiltersAndSort();
      };
      statSelect.addEventListener("change", () => {
        refreshComparisonOptions();
        sync();
      });
      comparisonSelect.addEventListener("change", sync);
      valueInput.addEventListener("input", sync);
      row.querySelector('[data-role="remove"]').addEventListener("click", () => {
        dynamicFilters = dynamicFilters.filter((x) => x.id !== id);
        row.remove();
        applyFiltersAndSort();
      });
    }

    document.getElementById("add-filter-btn").addEventListener("click", addFilterRow);

    const NAME_SUFFIXES = new Set(["jr", "sr", "ii", "iii", "iv", "v"]);
    function lastNameOf(fullName) {
      if (!fullName) return "";
      const parts = fullName.trim().split(/\s+/);
      let idx = parts.length - 1;
      while (idx > 0 && NAME_SUFFIXES.has(parts[idx].toLowerCase().replace(/\.$/, ""))) {
        idx--;
      }
      return parts[idx] || "";
    }

    function heightToInches(raw) {
      if (!raw) return NaN;
      const m = String(raw).match(/(\d+)'?\s*(\d+)?/);
      if (!m) return NaN;
      return (parseInt(m[1], 10) || 0) * 12 + (parseInt(m[2], 10) || 0);
    }

    function weightToLbs(raw) {
      if (!raw) return NaN;
      const m = String(raw).match(/(\d+)/);
      return m ? parseInt(m[1], 10) : NaN;
    }

    function recordToWinPct(raw) {
      if (!raw) return NaN;
      const parts = String(raw).split("-");
      if (parts.length !== 2) return NaN;
      const w = parseInt(parts[0], 10);
      const l = parseInt(parts[1], 10);
      if (Number.isNaN(w) || Number.isNaN(l) || w + l === 0) return NaN;
      return w / (w + l);
    }

    function compareNumbers(playerValue, comparison, filterValue) {
      if (Number.isNaN(playerValue) || Number.isNaN(filterValue)) return false;
      switch (comparison) {
        case ">=":
          return playerValue >= filterValue;
        case "<=":
          return playerValue <= filterValue;
        case "=":
          return Math.abs(playerValue - filterValue) < 0.01;
        case ">":
          return playerValue > filterValue;
        case "<":
          return playerValue < filterValue;
        default:
          return true;
      }
    }

    function playerMatchesDynamicFilter(p, f) {
      if (!f.value) return true;
      const opt = STAT_OPTIONS.find((o) => o.value === f.stat);
      const type = opt ? opt.type : "number";

      if (type === "string") {
        const pv = (p[f.stat] ?? "").toString().toLowerCase();
        const fv = f.value.toLowerCase();
        return f.comparison === "!=" ? pv !== fv : pv === fv;
      }
      if (type === "height") {
        return compareNumbers(heightToInches(p.height), f.comparison, heightToInches(f.value) || parseFloat(f.value));
      }
      if (type === "weight") {
        return compareNumbers(weightToLbs(p.weight), f.comparison, parseFloat(f.value));
      }
      if (type === "record") {
        return compareNumbers(recordToWinPct(p.record), f.comparison, parseFloat(f.value));
      }
      return compareNumbers(parseFloat(p[f.stat]), f.comparison, parseFloat(f.value));
    }

    function currentFilters() {
      return {
        search: document.getElementById("search").value.trim().toLowerCase(),
        school: document.getElementById("filter-school").value,
        position: document.getElementById("filter-position").value,
        cls: document.getElementById("filter-class").value,
      };
    }

    function applyFiltersAndSort() {
      const f = currentFilters();
      let rows = allPlayers.filter((p) => {
        if (currentConference !== "All" && p.conference !== currentConference) return false;
        if (f.search && !p.name.toLowerCase().includes(f.search)) return false;
        if (f.school && p.school !== f.school) return false;
        if (f.position && p.position !== f.position) return false;
        if (f.cls && p.class !== f.cls) return false;
        return dynamicFilters.every((df) => playerMatchesDynamicFilter(p, df));
      });

      rows.sort((a, b) => {
        const av = sortKey === "name" ? lastNameOf(a.name) : a[sortKey];
        const bv = sortKey === "name" ? lastNameOf(b.name) : b[sortKey];
        const an = av === null || av === undefined;
        const bn = bv === null || bv === undefined;
        if (an && bn) return 0;
        if (an) return 1;
        if (bn) return -1;
        if (typeof av === "number" || typeof bv === "number") {
          return sortAsc ? av - bv : bv - av;
        }
        return sortAsc
          ? String(av).localeCompare(String(bv))
          : String(bv).localeCompare(String(av));
      });

      renderRows(rows);
      document.getElementById("status-line").textContent =
        `${rows.length} of ${allPlayers.length} players`;
    }

    function renderRows(rows) {
      const tbody = document.getElementById("players-tbody");
      tbody.innerHTML = rows
        .map(
          (p) => `
        <tr onclick="window.location.href='${playerLink(p.player_id)}'">
          <td>${escapeHtml(p.name)}</td>
          <td>${escapeHtml(p.school)}</td>
          <td>${escapeHtml(p.conference)}</td>
          <td>${escapeHtml(p.position)}</td>
          <td>${escapeHtml(p.class)}</td>
          <td>${fmtStat(p.ppg)}</td>
          <td>${fmtStat(p.rpg)}</td>
          <td>${fmtStat(p.apg)}</td>
          <td>${fmtStat(p.spg)}</td>
          <td>${fmtStat(p.bpg)}</td>
          <td>${fmtPct(p.fg_pct)}</td>
          <td>${fmtPct(p.three_pct)}</td>
          <td>${fmtPct(p.ft_pct)}</td>
        </tr>`
        )
        .join("");
    }

    function updateSortHeaders() {
      document.querySelectorAll("th[data-sort]").forEach((th) => {
        th.classList.remove("sorted", "sorted-asc");
        if (th.dataset.sort === sortKey) {
          th.classList.add(sortAsc ? "sorted-asc" : "sorted");
        }
      });
    }

    document.querySelectorAll("th[data-sort]").forEach((th) => {
      th.addEventListener("click", () => {
        const key = th.dataset.sort;
        if (sortKey === key) {
          sortAsc = !sortAsc;
        } else {
          sortKey = key;
          sortAsc = true;
        }
        updateSortHeaders();
        applyFiltersAndSort();
      });
    });

    ["search", "filter-school", "filter-position", "filter-class"].forEach((id) => {
      document.getElementById(id).addEventListener("input", applyFiltersAndSort);
    });

    (async function init() {
      try {
        allPlayers = await fetchAllPlayers();
        populateFilterOptions();
        renderConferenceTabs();
        updateSortHeaders();
        applyFiltersAndSort();
      } catch (e) {
        document.getElementById("status-line").textContent =
          "Failed to load players: " + e.message;
        console.error(e);
      }
    })();
  </script>
</body>
</html>
